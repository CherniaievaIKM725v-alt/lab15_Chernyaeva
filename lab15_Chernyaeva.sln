#include <iostream>
#include <algorithm>
using namespace std;

int main() {
    int a[10];

    cout << "Enter 10 numbers: ";
    for (int i = 0; i < 10; i++)
        cin >> a[i];

    int temp[10];
    int idx = 0;

    for (int i = 0; i < 10; i++)
        if (a[i] < 0)
            temp[idx++] = a[i];

    for (int i = 0; i < 10; i++)
        if (a[i] >= 0)
            temp[idx++] = a[i];

    for (int i = 0; i < 10; i++)
        a[i] = temp[i];

    cout << "Negatives first: ";
    for (int i = 0; i < 10; i++)
        cout << a[i] << " ";
    cout << endl;

    sort(a, a + 10);

    cout << "Sorted: ";
    for (int i = 0; i < 10; i++)
        cout << a[i] << " ";
    cout << endl;

    return 0;
}
